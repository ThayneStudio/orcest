# Orchestrator configuration
redis:
  host: redis
  port: 6379
  # socket_timeout: 30          # Seconds before a Redis operation times out
  # socket_connect_timeout: 10  # Seconds before a Redis connection attempt times out

github:
  # GitHub personal access token (or set GITHUB_TOKEN env var)
  token: ""
  # Repository to manage
  repo: "owner/orcest"

polling:
  # Seconds between GitHub polling cycles
  interval: 60

# Default runner backend for new tasks
default_runner: "claude"

# Runner settings used to compute task marker TTLs; keep these aligned with workers.
runner:
  timeout: 1800
  max_retries: 3
  retry_backoff: 10
  # Optional Claude model; null/empty/omitted uses the Claude CLI default
  # model: opus

labels:
  blocked: "orcest:blocked"
  needs_human: "orcest:needs-human"
  ready: "orcest:ready"

# Multi-provider configuration (Task 7+ Grok enablement and beyond)
#
# The orchestrator is completely agnostic to execution mechanics.
# See docs/rollout-multi-provider.md and the Provider Registration & Invocation Boundary.
# All execution recipes live in the worker image (PROVIDER_REGISTRY in runner.py).
#
# Example mixed providers list (top-level applies to all projects; can be
# overridden or merged per-project under projects[].providers):
#
providers:
  - provider: claude
    credential: ""                 # falls back via _PROVIDER_ENV_CANDIDATES or CLAUDE_CODE_OAUTH_TOKEN
    model: claude-3-5-sonnet-20241022
  # - provider: grok
  #   credential: ""               # falls back to XAI_API_KEY / GROK_API_KEY (see config.py)
  #   model: grok-3-latest
  #   extras:
  #     temperature: "0.2"

# Legacy single-claude path (still supported via synthesis into ProviderEntry):
# claude_tokens: ["sk-ant-..."]     # or set CLAUDE_CODE_OAUTH_TOKENS in env
#
# Workers that have the CLI for a provider baked will execute tasks for it;
# workers that do not will early-reject with permanent FAILED + "rebake the
# worker image to include <provider> CLI". Safe mixed claude + new providers.

# Monitor ingest (EventRelay). Unset/null disables the relay -- orcest is
# otherwise unaffected. The write token is read from the named env var at
# process start (never store the token itself in this file).
# monitor_ingest_url: "http://monitor:9091/ingest/v1/events"
# monitor_write_token_env: "MONITOR_WRITE_TOKEN"
