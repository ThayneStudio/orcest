# Worker configuration
redis:
  host: redis
  port: 6379
  # socket_timeout: 30          # Seconds before a Redis operation times out
  # socket_connect_timeout: 10  # Seconds before a Redis connection attempt times out

# Unique identifier for this worker
worker_id: "worker-0"
# Directory for temporary repo clones
workspace_dir: "/tmp/orcest-workspaces"

# One-shot workers exit after a task. Pool-managed clones additionally require
# a durable pool:done handoff before shutdown; standalone `orcest work --once`
# leaves pool_managed false.
ephemeral: false
pool_managed: false

# Which task stream to subscribe to (tasks:claude, tasks:grok, etc.).
# Each worker instance is typically specialized to one backend/stream, but the
# local PROVIDER_REGISTRY (runner.py) can support dispatch for multiple providers
# if you point the worker at a stream that carries heterogeneous tasks.
backend: "claude"

runner:
  # Runner implementation (claude, noop, etc.). The actual provider dispatch
  # for a received Task uses the worker-local registry + generic CLI path.
  type: claude
  # Optional: pool workers can opt into Claude's interactive mode to avoid the
  # `claude -p` path while keeping the legacy non-interactive runner supported.
  # extra:
  #   mode: interactive
  # Timeout in seconds for a single runner invocation. This is the hard
  # wall-clock ceiling; with the watchdog enabled (default) most tasks end
  # well before this via STUCK/LOOPING/WAITING detection, not this timeout.
  timeout: 21600
  # Max retries on runner crash
  max_retries: 3
  # Seconds between retries
  retry_backoff: 10
  # Optional Claude model; null/empty/omitted uses the Claude CLI default
  # model: opus

  # Activity watchdog: detects a stalled/looping/silently-waiting task well
  # before the hard `timeout` above and ends it early. Set `enabled: false`
  # to reproduce pre-watchdog behavior exactly (fixed wall-clock timeout
  # only) -- this is the rollback lever.
  watchdog:
    enabled: true
    # Seconds between activity samples.
    sample_interval: 30
    # Seconds after task start before the watchdog starts evaluating (lets
    # the CLI/model warm up without tripping STUCK).
    startup_grace: 600
    # Seconds of no observed activity before a task is considered STUCK.
    idle_window: 600
    # Seconds a task may sit in a WAITING (e.g. tool-approval) state before
    # being treated as stalled.
    waiting_grace: 1800
    # Consecutive identical tool calls before flagging an exact-repeat loop.
    loop_exact_threshold: 4
    # Consecutive tool-call errors before flagging an error loop.
    loop_error_threshold: 3
    # Consecutive alternating (A/B/A/B...) tool calls before flagging a
    # ping-pong loop.
    loop_pingpong_threshold: 6
