name: CI

on:
  pull_request:
  push:
    branches: [master]
  # A push event can go missing: on 2026-08-19 the squash merge of #554 landed
  # on master and GitHub delivered neither a PushEvent nor a workflow run, so
  # master sat unverified with nobody aware. This cron re-verifies master's head
  # on a fixed cadence, which also keeps the `integration` job (push/dispatch
  # only) from going stale. Deliberately off the hour -- GitHub's scheduler is
  # best-effort and most contended at :00.
  #
  # This bounds the blind spot, it does not close it: a scheduled run queues on
  # the same self-hosted fleet as everything else, so a fleet outage silences
  # the check exactly when it matters. Fully closing "nobody noticed" needs an
  # external assertion that master's head SHA has a successful run.
  schedule:
    - cron: "17 6,18 * * *"
  workflow_dispatch:

jobs:
  lint:
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout repository
        # Manual checkout avoids actions/checkout@v4 download failures on
        # self-hosted runners that lack GitHub Actions marketplace access.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" init -q 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" remote remove origin 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth 1 origin "${{ github.sha }}"
          git -C "$GITHUB_WORKSPACE" reset --hard FETCH_HEAD
          git -C "$GITHUB_WORKSPACE" clean -ffdx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml', 'requirements.lock', 'requirements-dev.lock', 'requirements-dev-toolchain.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps --no-build-isolation -e .
      - run: make check-lock-dev
      - run: make lint-check

  typecheck:
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" init -q 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" remote remove origin 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth 1 origin "${{ github.sha }}"
          git -C "$GITHUB_WORKSPACE" reset --hard FETCH_HEAD
          git -C "$GITHUB_WORKSPACE" clean -ffdx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml', 'requirements.lock', 'requirements-dev.lock', 'requirements-dev-toolchain.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps --no-build-isolation -e .
      - run: make typecheck

  test:
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" init -q 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" remote remove origin 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth 1 origin "${{ github.sha }}"
          git -C "$GITHUB_WORKSPACE" reset --hard FETCH_HEAD
          git -C "$GITHUB_WORKSPACE" clean -ffdx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml', 'requirements.lock', 'requirements-dev.lock', 'requirements-dev-toolchain.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps --no-build-isolation -e .
      - run: make test-unit

  dashboard:
    runs-on: [self-hosted, linux]
    env:
      DASHBOARD_CLEAN_COPY_RUNNER: native
    steps:
      - name: Checkout repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" init -q 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" remote remove origin 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth 1 origin "${{ github.sha }}"
          git -C "$GITHUB_WORKSPACE" reset --hard FETCH_HEAD
          git -C "$GITHUB_WORKSPACE" clean -ffdx
      - uses: actions/setup-node@v4
        with:
          node-version-file: dashboard/.node-version
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: sh dashboard/scripts/check-tracked-files.sh
      - name: Check dashboard Docker clean-copy wrapper
        run: make check-dashboard-clean-copy
      - name: Test dashboard Make target
        run: make test-dashboard
      # Advisory only: `npm audit` hits the live registry, so a new transitive
      # advisory (or a registry outage) must not fail a PR that changed no code.
      # Failures stay visible as a red annotation on this step alone.
      - name: Audit dashboard dependencies (non-blocking)
        continue-on-error: true
        run: make audit-dashboard
      - name: Dry-run dashboard Make wrappers
        run: make -n test-dashboard audit-dashboard build-dashboard smoke-dashboard-compose deploy-dashboard-remote DASHBOARD_REMOTE=dashboard.example.invalid

  integration:
    runs-on: [self-hosted, linux]
    # Run on push to master to catch regressions automatically, on the schedule
    # above so a dropped push event cannot leave master unverified, and on
    # workflow_dispatch for on-demand runs. Scheduled runs always execute on the
    # default branch, so no extra ref guard is needed for that leg. Skipped on PR
    # branches to avoid Redis overhead on every push.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    steps:
      - name: Checkout repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" init -q 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" remote remove origin 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth 1 origin "${{ github.sha }}"
          git -C "$GITHUB_WORKSPACE" reset --hard FETCH_HEAD
          git -C "$GITHUB_WORKSPACE" clean -ffdx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml', 'requirements.lock', 'requirements-dev.lock', 'requirements-dev-toolchain.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps --no-build-isolation -e .
      - run: make test-integration

  docker:
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" init -q 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" remote remove origin 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth 1 origin "${{ github.sha }}"
          git -C "$GITHUB_WORKSPACE" reset --hard FETCH_HEAD
          git -C "$GITHUB_WORKSPACE" clean -ffdx
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Set dashboard Node version
        run: echo "DASHBOARD_NODE_VERSION=$(cat dashboard/.node-version)" >> $GITHUB_ENV
      - name: Check dashboard tracked files
        run: sh dashboard/scripts/check-tracked-files.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: orcest:ci
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache
          cache-to: ${{ github.ref == 'refs/heads/master' && format('type=registry,ref=ghcr.io/{0}:buildcache,mode=max', env.IMAGE_NAME) || '' }}
      - name: Build dashboard Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          load: true
          push: false
          tags: orcest-dashboard:ci
          build-args: |
            NODE_VERSION=${{ env.DASHBOARD_NODE_VERSION }}
      - name: Smoke dashboard Docker image
        run: DASHBOARD_SMOKE_TOKEN=ci-smoke-token sh dashboard/scripts/smoke-image.sh orcest-dashboard:ci
      - name: Smoke dashboard compose deployment
        run: DASHBOARD_SMOKE_TOKEN=ci-smoke-token DASHBOARD_SMOKE_REDIS_PASSWORD=ci-smoke-redis sh dashboard/scripts/smoke-compose.sh
