name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  lint:
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout repository
        # Manual checkout avoids actions/checkout@v4 download failures on
        # self-hosted runners that lack GitHub Actions marketplace access.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" init -q 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" remote remove origin 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth 1 origin "${{ github.sha }}"
          git -C "$GITHUB_WORKSPACE" reset --hard FETCH_HEAD
          git -C "$GITHUB_WORKSPACE" clean -ffdx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  typecheck:
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" init -q 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" remote remove origin 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth 1 origin "${{ github.sha }}"
          git -C "$GITHUB_WORKSPACE" reset --hard FETCH_HEAD
          git -C "$GITHUB_WORKSPACE" clean -ffdx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-
      - run: pip install -e ".[dev]"
      - run: mypy src/

  test:
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" init -q 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" remote remove origin 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth 1 origin "${{ github.sha }}"
          git -C "$GITHUB_WORKSPACE" reset --hard FETCH_HEAD
          git -C "$GITHUB_WORKSPACE" clean -ffdx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-
      - run: pip install -e ".[dev]"
      - run: pytest tests/ --ignore=tests/integration --ignore=tests/stress -m unit -x --cov=src/orcest --cov-report=term-missing

  dashboard:
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" init -q 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" remote remove origin 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth 1 origin "${{ github.sha }}"
          git -C "$GITHUB_WORKSPACE" reset --hard FETCH_HEAD
          git -C "$GITHUB_WORKSPACE" clean -ffdx
      - uses: actions/setup-node@v4
        with:
          node-version-file: dashboard/.node-version
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: sh dashboard/scripts/check-tracked-files.sh
      - name: Check dashboard Docker clean-copy wrapper
        run: make check-dashboard-clean-copy
      - name: Test dashboard Make target
        run: make test-dashboard
      # Advisory only: `npm audit` hits the live registry, so a new transitive
      # advisory (or a registry outage) must not fail a PR that changed no code.
      # Failures stay visible as a red annotation on this step alone.
      - name: Audit dashboard dependencies (non-blocking)
        continue-on-error: true
        run: make audit-dashboard
      - name: Dry-run dashboard Make wrappers
        run: make -n test-dashboard audit-dashboard build-dashboard smoke-dashboard-compose deploy-dashboard-remote DASHBOARD_REMOTE=dashboard.example.invalid

  integration:
    runs-on: [self-hosted, linux]
    # Run on push to master to catch regressions automatically, and on workflow_dispatch
    # for on-demand runs. Skipped on PR branches to avoid Redis overhead on every push.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" init -q 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" remote remove origin 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth 1 origin "${{ github.sha }}"
          git -C "$GITHUB_WORKSPACE" reset --hard FETCH_HEAD
          git -C "$GITHUB_WORKSPACE" clean -ffdx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-
      - run: pip install -e ".[dev]"
      - run: pytest tests/integration -x

  docker:
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" init -q 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" remote remove origin 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth 1 origin "${{ github.sha }}"
          git -C "$GITHUB_WORKSPACE" reset --hard FETCH_HEAD
          git -C "$GITHUB_WORKSPACE" clean -ffdx
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Set dashboard Node version
        run: echo "DASHBOARD_NODE_VERSION=$(cat dashboard/.node-version)" >> $GITHUB_ENV
      - name: Check dashboard tracked files
        run: sh dashboard/scripts/check-tracked-files.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: orcest:ci
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache
          cache-to: ${{ github.ref == 'refs/heads/master' && format('type=registry,ref=ghcr.io/{0}:buildcache,mode=max', env.IMAGE_NAME) || '' }}
      - name: Build dashboard Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          load: true
          push: false
          tags: orcest-dashboard:ci
          build-args: |
            NODE_VERSION=${{ env.DASHBOARD_NODE_VERSION }}
      - name: Smoke dashboard Docker image
        run: DASHBOARD_SMOKE_TOKEN=ci-smoke-token sh dashboard/scripts/smoke-image.sh orcest-dashboard:ci
      - name: Smoke dashboard compose deployment
        run: DASHBOARD_SMOKE_TOKEN=ci-smoke-token DASHBOARD_SMOKE_REDIS_PASSWORD=ci-smoke-redis sh dashboard/scripts/smoke-compose.sh
