name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read

    steps:
      - name: Install dependencies (libatomic1, unzip, jq, gh CLI)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libatomic1 unzip jq
          if ! command -v gh &>/dev/null; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli-stable.list > /dev/null
            sudo apt-get update -qq && sudo apt-get install -y -qq gh
          fi

      - name: Checkout repository
        # We use a manual git checkout instead of actions/checkout@v4 because
        # self-hosted runners may have a pre-existing GITHUB_WORKSPACE directory
        # that causes actions/checkout to fail with permission or dirty-state
        # errors.  The manual approach is resilient: it re-initialises the repo
        # in place and fetches only the PR tip (--depth 1) to minimise data
        # transferred.
        #
        # Note: only the PR head ref is fetched here; origin/<base-branch> is
        # NOT available locally.  The claude-code-action review step relies on
        # `gh pr diff` (API-based) rather than local git operations, so the
        # missing base ref is not a problem in practice.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" init -q 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" remote remove origin 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth 1 origin \
            "+refs/pull/${{ github.event.pull_request.number }}/head"
          git -C "$GITHUB_WORKSPACE" checkout FETCH_HEAD

      - name: Run Claude Code Review
        id: review
        # Pin the action SHA so its bundled Claude Code CLI cannot float
        # underneath this workflow. That is hygiene (same convention as
        # 178bfa8): a floating third-party tag is reason enough. This SHA
        # is not a known-good config: job 96233905625 ran it and failed.
        #
        # 2026-08-19 had a bounded upstream failure window (~20:13Z-22:38Z
        # observed; next pass 23:24Z, so the true end is unobserved). The
        # step failed before or during the first model turns with near-zero
        # spend (is_error:true, $0). Action SHA, CLI version, and
        # setting-sources were each independently ruled out: jobs failed
        # on this pin + CLI 2.1.235 + settingSources user,project,local,
        # and the same config passed both before and after the window.
        # The cause is upstream; it has not reproduced since.
        uses: anthropics/claude-code-action@d40ddef4c030e508327d6e35a9c45f3368482c50
        # Treat the AI review as advisory: opaque Claude Action startup/auth
        # failures should not block otherwise green PR CI.
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          include_fix_links: true
          prompt: |
            You are a code reviewer for PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            Instructions:
            1. Run `gh pr view ${{ github.event.pull_request.number }}` to get the PR title, author, and description.
            2. Run `gh pr diff ${{ github.event.pull_request.number }}` to get the changes.
            3. Read the repository's .claude/CLAUDE.md for project conventions.
            4. Review the changes for:
               - Code quality and best practices
               - Potential bugs or issues
               - Performance considerations
               - Security concerns
            5. For specific code issues, use the `mcp__github_inline_comment__create_inline_comment` tool to leave inline comments on the relevant lines. If the inline comment tool is unavailable, include file-specific feedback in your review body instead.
            6. Be concise — focus only on actionable feedback for actual changes in this PR.
               Do NOT leave comments that are purely positive or acknowledging (e.g. "Good fix", "Looks correct", "Nice approach").
               Only comment when something needs to change or when there is a genuine concern.
            7. After reviewing, submit your final verdict:
               - If the changes look good with no blocking issues: `gh pr review ${{ github.event.pull_request.number }} --approve --body "YOUR_SUMMARY"`
               - If there are issues that must be fixed: `gh pr review ${{ github.event.pull_request.number }} --request-changes --body "YOUR_SUMMARY"`

            Do NOT use `gh pr comment`. Use only inline comments for specific feedback and `gh pr review` for the final verdict.

          claude_args: '--allowedTools "Read,Write,Glob,Grep,Bash(gh *),mcp__github_inline_comment__create_inline_comment"'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Surface missing review
        # The review step above has continue-on-error: true (see #552), so a
        # crashed Claude Action still reports the claude-review check as
        # success with no review posted. steps.review.outcome (unlike
        # .conclusion) is not masked by continue-on-error, so it is the only
        # signal that distinguishes "reviewed, nothing blocking" from "never
        # ran". This step does not fail the job — only annotates it — so it
        # does not reintroduce the red-flagging #552 deliberately removed.
        if: steps.review.outcome == 'failure'
        continue-on-error: true
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          EXECUTION_FILE="${{ steps.review.outputs.execution_file }}"
          ENVELOPE="no result envelope available"
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            if ! command -v jq >/dev/null 2>&1; then
              ENVELOPE="jq is not available; cannot parse result envelope"
            elif EXTRACTED=$(jq -c '[.[] | select(.type == "result")] | last | {subtype, is_error, num_turns, total_cost_usd}' "$EXECUTION_FILE" 2>&1); then
              if [ -n "$EXTRACTED" ] && [ "$EXTRACTED" != "null" ]; then
                ENVELOPE="$EXTRACTED"
              fi
            else
              PARSE_ERROR=$(printf '%s' "$EXTRACTED" | tr '\r\n' '  ' | head -c 300)
              ENVELOPE="failed to parse result envelope with jq: ${PARSE_ERROR}"
            fi
          fi

          echo "::warning::claude-review completed without posting a review for PR #${PR_NUMBER}. Result envelope: ${ENVELOPE}"

          {
            echo "## claude-review: no review posted"
            echo ""
            echo "The review step completed without posting a review for PR #${PR_NUMBER}."
            echo ""
            echo "Result envelope: \`${ENVELOPE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
