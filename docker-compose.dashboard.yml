services:
  dashboard:
    image: ${DASHBOARD_IMAGE:-orcest-dashboard:latest}
    build:
      context: ./dashboard
      args:
        NODE_VERSION: ${DASHBOARD_NODE_VERSION:-20.18.3}
    ports:
      # Bind to loopback only: the dashboard is a human-browser convenience
      # stack, not a cross-VM service (unlike Redis). Reach it via an SSH
      # tunnel / reverse proxy. Combined with the now-fail-closed auth, this
      # keeps the port off the LAN. See M2-sec.
      - "127.0.0.1:8080:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ORCEST_REDIS_PASSWORD=${ORCEST_REDIS_PASSWORD:?ORCEST_REDIS_PASSWORD is required}
      - DASHBOARD_TOKEN=${DASHBOARD_TOKEN:?DASHBOARD_TOKEN is required}
      - DASHBOARD_ALLOWED_ORIGINS
      - DASHBOARD_REDIS_PREFIXES
      - DASHBOARD_MAX_ATTEMPTS
      - DASHBOARD_RUNNER_TIMEOUT_SECONDS
      - DASHBOARD_RUNNER_MAX_RETRIES
      - DASHBOARD_PENDING_TASK_TTL_SECONDS
      - DASHBOARD_LOCK_TTL_SECONDS
      - LOCK_TTL_SECONDS
      - ORCEST_MAX_ATTEMPTS
      - ORCEST_RUNNER_TIMEOUT_SECONDS
      - ORCEST_RUNNER_MAX_RETRIES
      - ORCEST_PENDING_TASK_TTL_SECONDS
      - ORCEST_LOCK_TTL_SECONDS
    restart: unless-stopped
    healthcheck:
      # Liveness only: the dashboard can render Redis-disconnected state itself.
      # Use /api/ready when a probe should require Redis connectivity.
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 512m
    networks:
      - orcest

networks:
  orcest:
    external: true
    name: ${ORCEST_DOCKER_NETWORK:-orcest}
