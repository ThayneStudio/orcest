services:
  monitor:
    image: ${ORCEST_MONITOR_IMAGE:-orcest-monitor:latest}
    build:
      context: .
      dockerfile: Dockerfile.monitor
    restart: unless-stopped
    environment:
      - MONITOR_WRITE_TOKEN=${MONITOR_WRITE_TOKEN:?set in .env}
      - MONITOR_TOKEN_ADMIN=${MONITOR_TOKEN_ADMIN:?set in .env}
      - MONITOR_TOKEN_GROK=${MONITOR_TOKEN_GROK:?set in .env}
    volumes:
      - ${ORCEST_MONITOR_CONFIG:-./config/monitor.yaml}:/etc/orcest/monitor.yaml:ro
      - monitor-db:/var/lib/orcest-monitor
      - "${ORCEST_TRACE_ARCHIVE_HOST_PATH:-/mnt/truenas-logs/orcest-traces}:/traces:ro"
    ports:
      # Query listener only: bind to loopback and reach it via SSH tunnel or
      # the cloudflared sidecar below -- never publish it directly to the LAN.
      - "127.0.0.1:9090:9090"
    # Ingest port 9091 is intentionally NOT published here; producers (the
    # orchestrator's EventRelay) reach it over the compose network at
    # http://monitor:9091/ingest/v1/events. It must never get a tunnel
    # hostname either -- see docs/monitor-exposure-runbook.md.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/api/v1/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - orcest

  # Opt-in origin connector for the remotely-managed Cloudflare Tunnel.
  # The Cloudflare-side public hostname must target http://monitor:9090.
  # Keeping this behind a profile lets the private monitor run normally until
  # CLOUDFLARE_TUNNEL_TOKEN is installed in the protected monitor env file.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [cloudflare]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      monitor:
        condition: service_healthy
    # Linux Docker does not create this Desktop-compatible hostname by
    # default.  The remotely-managed tunnel also has a legacy catch-all that
    # targets the VM-host service on port 8080, so make that origin resolvable
    # without publishing it to the LAN.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    mem_limit: 256m
    networks:
      - orcest

volumes:
  monitor-db: {}

networks:
  orcest:
    external: true
    name: ${ORCEST_DOCKER_NETWORK:-orcest}
