services:
  redis:
    image: redis:7-alpine
    ports:
      # Bind to 0.0.0.0 so worker VMs (separate hosts on the fleet's private
      # subnet) can reach Redis on the orchestrator VM. The security-audit
      # commit b13ccf9 had restricted this to 127.0.0.1, which broke the
      # multi-VM architecture. Rely on network-level isolation (lab subnet,
      # firewall) and Redis AUTH for production exposure.
      - "0.0.0.0:6379:6379"
    volumes:
      - redis-data:/data
    # AUTH required. ORCEST_REDIS_PASSWORD is supplied via the compose --env-file
    # / process env on the orchestrator VM. 0.0.0.0 bind retained intentionally
    # (multi-VM fleet: worker VMs reach Redis over the private subnet); the bind
    # is no longer unauthenticated.
    environment:
      # --env-file only interpolates ${VAR} into the command above; it does NOT
      # put the var into the container's runtime env. The healthcheck (below)
      # and `docker exec ... redis-cli -a "$ORCEST_REDIS_PASSWORD"` (the fleet's
      # _REDIS_CLI_PREFIX) read it INSIDE the container, so it must be here too,
      # else the healthcheck auths with an empty password -> container reports
      # "unhealthy" and fleet redis-cli ops fail WRONGPASS.
      - ORCEST_REDIS_PASSWORD=${ORCEST_REDIS_PASSWORD}
    command: redis-server --requirepass ${ORCEST_REDIS_PASSWORD} --appendonly yes --maxmemory 1gb --maxmemory-policy noeviction
    restart: unless-stopped
    healthcheck:
      # $$ escapes Compose interpolation so the var is read inside the container.
      test: ["CMD-SHELL", "redis-cli -a $${ORCEST_REDIS_PASSWORD} --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    # Leave room above Redis's dataset ceiling for allocator/AOF overhead so
    # Docker cannot OOM-kill it before the noeviction guard takes effect.
    mem_limit: 1536m
    networks:
      - orcest

volumes:
  redis-data:

networks:
  orcest:
    name: orcest
