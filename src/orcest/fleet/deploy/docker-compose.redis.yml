services:
  redis:
    image: redis:7-alpine
    ports:
      # Bind to 0.0.0.0 so worker VMs (separate hosts on the fleet's private
      # subnet) can reach Redis on the orchestrator VM. The security-audit
      # commit b13ccf9 had restricted this to 127.0.0.1, which broke the
      # multi-VM architecture. Rely on network-level isolation (lab subnet,
      # firewall) and Redis AUTH for production exposure.
      - "0.0.0.0:6379:6379"
    volumes:
      - redis-data:/data
    # AUTH required. ORCEST_REDIS_PASSWORD is supplied via the compose --env-file
    # / process env on the orchestrator VM. 0.0.0.0 bind retained intentionally
    # (multi-VM fleet: worker VMs reach Redis over the private subnet); the bind
    # is no longer unauthenticated.
    command: redis-server --requirepass ${ORCEST_REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    restart: unless-stopped
    healthcheck:
      # $$ escapes Compose interpolation so the var is read inside the container.
      test: ["CMD-SHELL", "redis-cli -a $${ORCEST_REDIS_PASSWORD} --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    mem_limit: 512m
    networks:
      - orcest

volumes:
  redis-data:

networks:
  orcest:
    name: orcest
