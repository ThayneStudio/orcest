services:
  orchestrator:
    image: ${ORCEST_IMAGE:-orcest:latest}
    build:
      context: .
      args:
        ORCEST_BUILD_REVISION: ${ORCEST_BUILD_REVISION:-unknown}
        ORCEST_UID: ${ORCEST_UID:-1000}
        ORCEST_GID: ${ORCEST_GID:-1000}
    volumes:
      - ${ORCEST_CONFIG_DIR:-./config}:/home/orcest/app/config:ro
      # Verbatim per-task trace archive. When ORCEST_TRACE_HOST_PATH is unset
      # (default), this falls back to /dev/null — the in-container archiver
      # probes writability at startup, sees it fail, and self-disables. When
      # set to a directory, the archiver writes per-task .jsonl + .meta.json
      # files there. Storage backend (NFS, local disk, anything) is opaque to
      # orcest; the operator mounts whatever they want at ORCEST_TRACE_HOST_PATH.
      - ${ORCEST_TRACE_HOST_PATH:-/dev/null}:/var/lib/orcest/traces
      # Optional fleet config read-only mount. When present, the archiver
      # builds a global repo→project map from it so traces for projects
      # other than this orchestrator's own land under the right project
      # directory (instead of the ``unknown/`` fallback). Mounted outside
      # the read-only /home/orcest/app/config dir to avoid the OCI
      # read-only-mountpoint error. Falls back to /dev/null when the host
      # file is missing; the loader silently skips on parse error.
      - ${ORCEST_FLEET_CONFIG_PATH:-/dev/null}:/home/orcest/fleet-config.yaml:ro
    environment:
      - GITHUB_TOKEN
      - GH_TOKEN=${GITHUB_TOKEN}
      - CLAUDE_CODE_OAUTH_TOKEN
      - CLAUDE_CODE_OAUTH_TOKENS
      # Multi-provider support (populated via fleet org provider_credentials + generate_env_file).
      # Each new provider needs its canonical env var listed here for Docker
      # Compose to passthrough (Compose only forwards explicitly-named env
      # vars; otherwise the .env value never reaches the container).
      - XAI_API_KEY
      - GROK_API_KEY
      - CLAUDER_API_KEY
      - CODEX_API_KEY
      - OPENAI_API_KEY
      - ORCEST_REDIS_HOST=redis
      - ORCEST_REDIS_KEY_PREFIX
      # Forwarded from the per-project .env so the orchestrator authenticates to
      # the now-password-protected Redis (Compose only passes named vars).
      - ORCEST_REDIS_PASSWORD
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,redis; redis.Redis('redis', password=os.environ.get('ORCEST_REDIS_PASSWORD')).ping()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    mem_limit: 1g
    networks:
      - orcest

networks:
  orcest:
    external: true
    name: orcest
