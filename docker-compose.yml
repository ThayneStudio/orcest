services:
  orchestrator:
    image: ${ORCEST_IMAGE:-orcest:latest}
    build:
      context: .
      args:
        ORCEST_BUILD_REVISION: ${ORCEST_BUILD_REVISION:-unknown}
        ORCEST_UID: ${ORCEST_UID:-1000}
        ORCEST_GID: ${ORCEST_GID:-1000}
    volumes:
      - ${ORCEST_CONFIG_DIR:-./config}:/home/orcest/app/config:ro
      # Workflow-Control v1 ownership database used by the legacy selector.
      # Configure workflow_state_root=/var/lib/orcest/workflow alongside this mount.
      - ${ORCEST_WORKFLOW_STATE_HOST_PATH:-/dev/null}:/var/lib/orcest/workflow:ro
    environment:
      - GITHUB_TOKEN
      - GH_TOKEN=${GITHUB_TOKEN}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - CLAUDE_CODE_OAUTH_TOKENS=${CLAUDE_CODE_OAUTH_TOKENS:-}
      # Additional providers (emitted by fleet generate_env_file when using provider_credentials)
      - XAI_API_KEY=${XAI_API_KEY:-}
      - GROK_API_KEY=${GROK_API_KEY:-}
      - CLAUDER_API_KEY=${CLAUDER_API_KEY:-}
      - CODEX_API_KEY=${CODEX_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ORCEST_REDIS_HOST=redis
      - ORCEST_REDIS_KEY_PREFIX
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; redis.Redis('redis').ping()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    mem_limit: 1g
    networks:
      - orcest

networks:
  orcest:
    external: true
    name: orcest
